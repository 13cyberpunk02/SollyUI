name: Deploy demo to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish WASM
        run: dotnet publish SollyUI.Demo.Wasm/SollyUI.Demo.Wasm.csproj -c Release -o publish

      - name: Rewrite base href for project subpath
        run: |
          sed -i -E 's|<base[^>]*>|<base href="/SollyUI/" />|' publish/wwwroot/index.html
          echo "--- base href result ---"
          grep -i "<base" publish/wwwroot/index.html

      - name: Create 404 fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Check blazor js
        run: |
          echo "=== blazor js files ==="
          ls -la publish/wwwroot/_framework/ | grep -i blazor
          echo "=== dotnet js files ==="
          ls -la publish/wwwroot/_framework/ | grep -i "dotnet"
      
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4