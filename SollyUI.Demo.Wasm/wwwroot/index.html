<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Solly UI — WASM</title>
    <base href="/"/>

    <script>
        (function () {
            try {
                var t = localStorage.getItem('solly-theme') || 'dark';
                if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                document.documentElement.setAttribute('data-solly-theme', t);
            } catch (e) {
            }
        })();
    </script>
    <script>
        (function () {
            var redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            if (redirect && redirect !== location.href) {
                history.replaceState(null, null, redirect);
            }
        })();
    </script>

    <link rel="stylesheet" href="_content/SollyUI/solly.css"/>
    <link rel="stylesheet" href="_content/SollyUI.Demo.Shared/app.css"/>
</head>
<body>
<div id="app">
    <div class="wasm-boot">
        <div class="wasm-boot-ring"></div>
        <span>Loading .NET runtime…</span>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <span class="dismiss">🗙</span>
</div>

<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
